# Environment of the benchmark for conda:
#     conda env create -f environment.yml
#     conda activate DrBenchmark
# The dependencies and their versions are only listed in requirements.txt, which pip installs
# in the environment: this file does not have to follow it.
name: DrBenchmark
channels:
  - conda-forge
  - nodefaults
dependencies:
  # The tests are run with Python 3.12 and above: see .github/workflows/tests.yml
  - python>=3.12
  - pip
  - pip:
      - -r requirements.txt
