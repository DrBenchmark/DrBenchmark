name: DrBenchmark
channels:
  - pytorch
  - huggingface
  - conda-forge
  - nodefaults
dependencies:
  - python>3.7
  - pip
  - pytorch
  # Older versions of transformers can be used but some package tweaking will be necessary
  - transformers>=4.40 # >4.40 for compatibility
  - datasets>=2.21  # >2.21 for HF_HUB_OFFLINE
  - evaluate>=0.4.1
  - scikit-learn>1.4  # >1.4 for root_mean_square_error
  - seqeval  # for metrics/seqeval.py
  - accelerate>=0.26  # why ?
  - tensorboardX
  - sacremoses  # for flaubert
  - sentencepiece  # for flaubert
  - openpyxl  # for tools/*
  - seaborn  # for tools/*